spring.application.name=back

server.port=${API_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:./build/testdb.sqlite}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:dev-secret}
jwt.expiration=${JWT_EXPIRATION:3600000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
app.cookie.secure=${APP_COOKIE_SECURE:true}
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

ADMIN_USERNAME=admin
ADMIN_PASSWORD=admin